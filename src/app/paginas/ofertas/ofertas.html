<!-- OFERTAS -->
<section class="ofertas py-5">

  <div class="text-center mb-5">
    <h2 class="fw-bold">Ofertas Especiales</h2>
    <p class="text-muted">
      Aprovecha nuestros productos más vendidos con descuento
    </p>
  </div>

 <!-- Contenedor de las tarjetas -->
  <div class="row g-4 justify-content-center">

    <!-- Recorremos el arreglo ofertas -->
    @for (oferta of ofertas; track oferta.nombre) {

    <div class="col-md-4">

      <div class="card oferta-card shadow-lg">

        <span class="badge-oferta">
          {{ oferta.descuento }}
        </span>

        <img [src]="oferta.imagen" class="card-img-top" [alt]="oferta.nombre">

        <div class="card-body text-center">

          <h5 class="card-title">
            {{ oferta.nombre }}
          </h5>

          <p class="precio">
            <span class="precio-viejo">
              ${{ oferta.precioViejo }}
            </span>

            <span class="precio-nuevo">
              ${{ oferta.precioNuevo }}
            </span>
          </p>

          <p class="card-text">
            {{ oferta.descripcion }}
          </p>
          <!--Se ejecuta el método comprar() Se envía la oferta seleccionada.Se crea un producto. Se agrega al carrito.-->
            <!--Aparece el alert.-->
          <button class="btn btn-pink" (click)="comprar(oferta)">

            Comprar ahora

          </button>

        </div>

      </div>

    </div>

    }

  </div>
</section>

<!--"Este archivo muestra todas las ofertas almacenadas en el arreglo ofertas del componente Ofertas.
//Utiliza la estructura de control @for para recorrer cada oferta y generar automáticamente una tarjeta con
//su imagen, nombre, precios, descuento y botón de compra."-->

<!--¿Dónde se generan las tarjetas de las ofertas? "Las tarjetas se generan automáticamente con la estructura @for.
 Angular recorre el arreglo ofertas definido en ofertas.ts y por cada objeto crea una tarjeta mostrando sus datos."-->
