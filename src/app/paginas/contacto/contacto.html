<!-- CONTACTO PRO -->
<section class="contacto py-5">
  <div class="container">
    
    <div class="text-center mb-5">
      <h2>Contacto</h2>
      <p>Estamos para ayudarte</p>
    </div>

    <div class="row g-4">

      <!-- INFO DE CONTACTO -->
      <div class="col-md-5">
        <div class="contact-info p-4 shadow">

          <h5 class="mb-3">Beauty Glow</h5>
          <p>Tu tienda de maquillaje favorita</p>

          <p><strong>Email:</strong> contacto@beautyglow.com</p>
          <p><strong>Teléfono:</strong> +54 9 299 123 4567</p>
          <p><strong>Ubicación:</strong> Cipolletti, Río Negro</p>

          <hr>

          <p><strong>Horarios:</strong></p>
          <p>Lunes a Viernes: 9:00 - 18:00</p>
          <p>Sábados: 10:00 - 14:00</p>

        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="col-md-7">
        <form class="contact-form p-4 shadow">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Escribí tu mensaje..."></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-pink">Enviar mensaje</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</section>
