<!-- CONTACTO PRO -->
<section class="contacto py-5">
  <div class="container">

    <div class="text-center mb-5">
      <h2>Contacto</h2>
      <p>Estamos para ayudarte</p>
    </div>

    <div class="row g-4">

      <!-- INFO DE CONTACTO -->
      <div class="col-md-5">
        <div class="contact-info p-4 shadow">

          <h5 class="mb-3">Beauty Glow</h5>
          <p>Tu tienda de maquillaje favorita</p>

          <p><strong>Email:</strong> contacto@beautyglow.com</p>
          <p><strong>Teléfono:</strong> +54 9 299 123 4567</p>
          <p><strong>Ubicación:</strong> Cipolletti, Río Negro</p>

          <hr>

          <p><strong>Horarios:</strong></p>
          <p>Lunes a Viernes: 9:00 - 18:00</p>
          <p>Sábados: 10:00 - 14:00</p>

        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="col-md-7">
        <form class="contact-form p-4 shadow">

          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Escribí tu mensaje..."></textarea>
          </div>
          <!--Cuando el usuario haga clic, ejecutar la función enviarMensaje() del archivo contacto.ts".-->
          <div class="text-center">
            <button type="button" class="btn btn-pink" (click)="enviarMensaje()">

              Enviar mensaje

            </button>
          </div>

        </form>
      </div>

    </div>
  </div>




  <!-- MAPA -->
  <div class="mt-5">

    <h3 class="text-center mb-4">
      Nuestra ubicación
    </h3>

    <iframe src="https://www.google.com/maps?q=Cipolletti,Rio%20Negro&output=embed" width="100%" height="350"
      style="border:0; border-radius:20px;" allowfullscreen="" loading="lazy">

    </iframe>

  </div>
</section>

<!--"El componente Contacto está dividido en dos partes. A la izquierda muestra la información de la empresa, como email, teléfono, ubicación y horarios. A la derecha tiene un formulario donde el 
usuario puede escribir su nombre, correo y mensaje. Cuando se presiona el botón Enviar mensaje se ejecuta la función enviarMensaje() definida en contacto.ts y aparece un alert de confirmación. Además,
 agregué un mapa utilizando un iframe de Google Maps para mostrar la ubicación de la empresa."-->
