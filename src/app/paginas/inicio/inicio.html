<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Beauty Glow</title>

</head>

<body>

  <!-- HERO -->
  <section class="hero d-flex align-items-center text-center">

    <div class="container">

      <h1 class="display-4 fw-bold">
        Realza tu belleza
      </h1>

      <p class="lead">
        Descubre maquillaje que resalta lo mejor de ti
      </p>

    </div>

  </section>

  <!-- PRODUCTOS DESTACADOS -->
  <section class="py-5">

    <div class="container text-center">

      <h2 class="mb-5">
        Productos Destacados
      </h2>

      <div class="row justify-content-center">

        @for (p of productosDestacados; track p.id) {

        <div class="col-md-4 mb-4">

          <div class="card shadow">

            <img [src]="p.imagen" class="card-img-top" [alt]="p.nombre">

            <div class="card-body">

              <h5>
                {{ p.nombre }}
              </h5>

              <p>
                ${{ p.precio }}
              </p>

              <p>
                {{ p.descripcion }}
              </p>

              <div class="d-flex justify-content-center gap-3">

                <button class="btn btn-pink" (click)="agregarAlCarrito(p)">

                  Comprar

                </button>

                <button class="btn-corazon" (click)="agregarFavorito(p)">

                  <i class="bi bi-heart"></i>

                </button>

              </div>

            </div>

          </div>

        </div>

        }

      </div>

    </div>

  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
