<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Beauty Glow</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fuente opcional -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Playfair Display', serif;
      background-color: #fff5f7;
    }

    .hero {
      height: 60vh;
      background: linear-gradient(rgba(255,192,203,0.5), rgba(255,182,193,0.6)),
                  url('https://via.placeholder.com/1200x800');
      background-size: cover;
      background-position: center;
      color: white;
    }

    .btn-pink {
      background-color: #ff69b4;
      color: white;
      border-radius: 30px;
    }

    .btn-pink:hover {
      background-color: #ff1493;
    }

    .card {
      border: none;
      border-radius: 15px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    footer {
      background-color: #ffe4e9;
    }
  </style>
</head>
<body>



<!-- HERO -->
<section class="hero d-flex align-items-center text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Realza tu belleza</h1>
    <p class="lead">Descubre maquillaje que resalta lo mejor de ti</p>
    <a href="#" class="btn btn-pink btn-lg mt-3">Comprar ahora</a>
  </div>
</section>

<!-- PRODUCTOS -->
<section class="py-5">
  <div class="container text-center">
    <h2 class="mb-4">Nuestros productos</h2>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://i.pinimg.com/736x/e4/35/2a/e4352adc5cdab695b4bda89b3664f82e.jpg" class="card-img-top" alt="Labial">
          <div class="card-body">
            <h5 class="card-title">Labial kiko</h5>
            <p class="card-text">$15.00</p>
            <a href="#" class="btn btn-pink">Comprar</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://i.pinimg.com/736x/d0/3e/a5/d03ea54e4dce667a4aa77a85cd268cbb.jpg" class="card-img-top" alt="Base">
          <div class="card-body">
            <h5 class="card-title">Base Líquida</h5>
            <p class="card-text">$25.00</p>
            <a href="#" class="btn btn-pink">Comprar</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://i.pinimg.com/736x/81/7a/e8/817ae8f68478cdfdb3e05cb18c8abca0.jpg" class="card-img-top" alt="Sombras">
          <div class="card-body">
            <h5 class="card-title">Paleta de Sombras</h5>
            <p class="card-text">$30.00</p>
            <a href="#" class="btn btn-pink">Comprar</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
