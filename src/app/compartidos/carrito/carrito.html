<div class="container">

  <h2>
    Tu Carrito
  </h2> <br>

  <table class="table">
    <thead>
      <tr>
        <th>#</th>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <!--@for(){
        
    }-->
      <!-- Recorremos todos los productos del carrito -->
      @for (p of productos; track p.id) {
      <!--track: "Identificá cada producto por su id."-->
      <tr>

        <!-- ID del producto -->
        <td>{{ p.id }}</td>

        <!-- Nombre -->
        <td>{{ p.nombre }}</td>

        <!-- Precio -->
        <td>${{ p.precio }}</td>
        <!-- Cantidad -->
        <td>

          <button class="btn btn-secondary btn-sm" (click)="disminuirCantidad($index)">

            -

          </button>

          <span class="mx-2">

            {{ cantidades[$index] }}

          </span>

          <button class="btn btn-secondary btn-sm" (click)="aumentarCantidad($index)">

            +

          </button>

        </td>

        <!-- Botón eliminar -->
        <td>
          <!--click: "Cuando el usuario haga click"-->
          <button class="btn btn-danger" (click)="eliminarProducto(p.id)">

            Eliminar

          </button>

        </td>

      </tr>

      }

    </tbody>
  </table>
  <div class="d-grid gap-2 d-md-flex justify-content-md-end botones">
    <button type="button" class="btn btn-danger btn-lg">Comprar</button>
    <button type="button" class="btn btn-secondary btn-lg">Eliminar</button>
  </div>

</div>

<!--En carrito.html utilicé una tabla Bootstrap para mostrar los productos agregados al carrito. Recorro el arreglo productos usando @for
 y muestro el id, nombre y precio de cada producto mediante interpolación. También agregué un botón para eliminar productos utilizando el evento click. Finalmente muestro el total llamando al método calcularTotal() y un botón para finalizar la compra que genera una factura mediante el método finalizarCompra()."-->

<!--"Este componente muestra en una tabla todos los productos agregados al carrito,
 permite eliminarlos, calcula el total y permite finalizar la compra."-->
