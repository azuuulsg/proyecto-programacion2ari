<!-- FAVORITOS -->
<section class="favoritos py-5">

  <section class="favoritos py-5">

    <div class="container">

      <h2 class="text-center mb-4">
        Mis Favoritos 
      </h2>

      <div class="row">
        <!-- Recorremos el arreglo productos -->
      <!-- Cada "p" representa un producto favorito -->
        @for (p of productos; track p.id) {

          <!-- Columna -->
        <div class="col-md-4 mb-4">

          <div class="card favorito-card">
             <!-- Imagen del producto -->
            <img [src]="p.imagen" class="card-img-top" alt="producto">

            <div class="card-body">

              <h5>{{ p.nombre }}</h5>

              <p>${{ p.precio }}</p>

              <p>{{ p.descripcion }}</p>

              <button class="btn btn-danger" (click)="eliminarFavorito(p.id)">

                 <i class="bi bi-heart"> Eliminar</i>

              </button>

            </div>

          </div>

        </div>

        }

      </div>

    </div>

  </section>

</section>

<!--"En este componente utilizo la estructura de control @for para recorrer el 
arreglo de productos favoritos. Por cada producto se genera una tarjeta que muestra su imagen, 
nombre, precio y descripción. También agregué un botón para eliminar productos de favoritos, que 
ejecuta el método eliminarFavorito() enviando el id del producto seleccionado."-->
