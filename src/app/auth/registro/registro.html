<!-- REGISTRO -->
<section class="registro py-5">
  <div class="container">
    <div class="text-center mb-4">
      <h2>Crear cuenta</h2>
      <p>Unite a Beauty Glow</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <!--Esto crea una referencia al formulario. Es como ponerle un nombre al formulario para poder usarlo después.
          Gracias a eso podemos hacer: click: y enviar el formulario completo a TypeScript.-->
        <form #formRegistro class="registro-form p-4 shadow">

          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="tu@email.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" placeholder="********">
          </div>

          <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" placeholder="********">
            <!--Oculta los caracteres mientras el usuario escribe.-->
          </div>

          <div class="text-center">
            <!--"Cuando el usuario haga clic en el botón, ejecutar la función registrar()".-->
            <button type="button" class="btn btn-pink" (click)="registrar(formRegistro)">

              Registrarse

            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</section>

<!--El archivo registro.html contiene la estructura visual del formulario de registro. Utilicé Bootstrap para centrar el contenido y darle estilo.
 El formulario tiene campos para nombre, email, contraseña y confirmar contraseña. 
 También agregué un botón 'Registrarse' que llama a una función del archivo TypeScript.
  Además, el formulario tiene una referencia llamada #formRegistro que permite limpiar todos los campos después de registrarse."-->
  
<!--Cómo se conecta registro.html con registro.ts?El botón Registrarse utiliza el evento (click) de Angular.
 Cuando el usuario hace clic, se ejecuta la función registrar() definida en registro.ts. Además, se envía el formulario mediante la referencia #formRegistro para poder limpiarlo usando reset()."-->
